name: release-please

# The org does not let GITHUB_TOKEN open pull requests, and a pull request opened by it
# would never start the required checks anyway. So this workflow only does the half
# that works with GITHUB_TOKEN: when a release PR is merged, it tags the commit and
# creates the GitHub release. The release PR itself is opened by a real identity:
#
#   npx release-please release-pr --repo-url yolo-labz/craftcut --token "$GH_TOKEN" \
#     --config-file release-please-config.json --manifest-file .release-please-manifest.json
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write       # create the tag and the GitHub release.
      pull-requests: write  # relabel the merged release PR (autorelease: tagged).
      actions: write        # dispatch release.yml for the new tag.
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4.1.3
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # A tag pushed by GITHUB_TOKEN does not trigger `on: push: tags`, so start the
      # build explicitly; workflow_dispatch is exempt from that rule.
      - name: Start the release build for the new tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
