name: release

on:
  push:
    tags:
      - "v*.*.*"
  # release-please.yml dispatches this at the tag it just created.
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.5.x"
          # A release build must not restore a cache that a PR run could have written.
          enable-cache: false

      - name: Reproducible build env
        run: |
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "PYTHONHASHSEED=0"
          } >> "$GITHUB_ENV"

      - name: Build sdist + wheel
        run: uv build

      - name: Generate SBOM (CycloneDX 1.7)
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6988e8349884 # v0.17.3
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          output-file: dist/sbom.cdx.json

      - name: Generate SBOM (SPDX 2.3)
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6988e8349884 # v0.17.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: dist/sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: craftcut-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: craftcut-dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing + PEP 740)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1.14.3
        with:
          packages-dir: dist/
          attestations: true

      - name: GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
            dist/sbom.spdx.json
          generate_release_notes: true
