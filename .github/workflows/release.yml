name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Reproducible build env
        run: |
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "PYTHONHASHSEED=0"
          } >> "$GITHUB_ENV"

      - name: Build sdist + wheel
        run: uv build

      - name: Generate SBOM (CycloneDX 1.7)
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6988e8349884 # v0.17.3
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          output-file: dist/sbom.cdx.json

      - name: Generate SBOM (SPDX 2.3)
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6988e8349884 # v0.17.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: dist/sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/sbom.cdx.json

      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: craftcut-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: craftcut-dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing + PEP 740)
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1.12.4
        with:
          packages-dir: dist/
          attestations: true

      - name: GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
            dist/sbom.spdx.json
          generate_release_notes: true
